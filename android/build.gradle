group = "br.com.jylabtech.cielo_payment_tech"
version = "1.0"

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.9.1")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

def nativeJarFiles = fileTree(dir: "libs", include: ["*-native.jar"]).files
if (nativeJarFiles.isEmpty()) {
    throw new GradleException("Nenhum artefato nativo encontrado em android/libs. Execute scripts/build_android_aar.sh para gerar o binário.")
}

android {
    namespace = "br.com.jylabtech.cielo_payment_tech"
    compileSdk = 36

    defaultConfig {
        minSdk = 24
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*-native.jar"])
    implementation("androidx.security:security-crypto:1.1.0-alpha05")

    testImplementation("junit:junit:4.13.2")
    testImplementation("org.mockito:mockito-core:5.0.0")
}
